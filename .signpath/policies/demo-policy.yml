github-build-policies:
  version: 1.0
  disallow_reruns: false

github-scm-policies:
  version: '1.0'
  ruleset_constraintswithtypo :
    - allow_bypass_actors: true
      rules: 
      - type: non_fast_forward
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              alerts_threshold: errors
              security_alerts_threshold: medium_or_higher
